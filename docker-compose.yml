# Spooldesk — dashboard with channel workers, and PostgreSQL.
#
# Quick start:
#   1. python scripts/setup.py      # generates .env (or copy .env.example → .env)
#   2. docker compose -p spooldesk up -d --build dashboard
#   3. open http://localhost:8000   # dashboard
#
# On a server with a domain, add the production overlay instead of step 2 —
# it puts TLS in front and stops the dashboard listening on anything but
# loopback:
#
#   docker compose -p spooldesk -f docker-compose.yml -f docker-compose.prod.yml up -d --build caddy
#
# Configure channels in Integrations. Dashboard manages their workers.
# The optional standalone bot service is retained for existing installations;
# new installations do not need it. Without BOT_TOKEN it logs why and exits, and
# `restart: on-failure` leaves it stopped rather than looping on that message.
#
# PostgreSQL is the default database. The data volume holds local attachments
# and separately protected key material; pgdata holds PostgreSQL itself.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spooldesk}
      POSTGRES_USER: ${POSTGRES_USER:-spooldesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    # The image is built by `dashboard`, which is the service that always
    # runs. Building here would leave a widget-only install — one that never
    # starts this service — with no image at all.
    image: ${SPOOLDESK_IMAGE:-spooldesk:latest}
    depends_on: [dashboard]
    command: python -m src.main
    env_file: ${SPOOLDESK_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-spooldesk}
      POSTGRES_DB: ${POSTGRES_DB:-spooldesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ATTACHMENTS_DIR: /app/data/attachments
    volumes:
      - data:/app/data
      - logs:/app/logs
    # on-failure, not unless-stopped: with no BOT_TOKEN this process exits
    # cleanly after saying so once, and `unless-stopped` would restart it into
    # the same message every few seconds forever.
    restart: on-failure
    logging: *bounded-logs

  dashboard:
    build: .
    image: ${SPOOLDESK_IMAGE:-spooldesk:latest}
    # --no-proxy-headers: uvicorn has its own X-Forwarded-For handling, on by
    # default. Two layers reading the same header is worse than one of them
    # being wrong, so src/dashboard/proxy.py is the only reader and this
    # switches the other off. What it trusts is TRUSTED_PROXY_HOPS.
    command: python -m uvicorn src.dashboard.app:app --host 0.0.0.0 --port 8000
      --no-proxy-headers
    env_file: ${SPOOLDESK_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-spooldesk}
      POSTGRES_DB: ${POSTGRES_DB:-spooldesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ATTACHMENTS_DIR: /app/data/attachments
      # Set DASH_COOKIE_SECURE=true in .env when serving over HTTPS.
    ports:
      # Loopback only, deliberately. On a laptop this is still
      # http://localhost:8000; on a VPS it is the difference between the
      # dashboard being reachable over plain HTTP by anyone who finds the
      # address and it being reachable only through the TLS proxy in
      # docker-compose.prod.yml. Publishing to 0.0.0.0 would quietly undo
      # the whole production overlay.
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/app/data
      - logs:/app/logs
    restart: unless-stopped
    logging: *bounded-logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
  logs:
  pgdata:

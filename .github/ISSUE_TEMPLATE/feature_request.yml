name: Feature request
description: Something the product should do and does not
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, not the solution. What does your team do today, and where
        does it cost you? A concrete morning beats a general principle.
      placeholder: |
        Two operators keep answering the same customer because neither can tell
        the other has the ticket open.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you had in mind
      description: Optional. If you already have a shape for it, describe it.

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: >
        Including "nothing, we live with it". How people work around a gap says
        a lot about how much the gap costs.

  - type: dropdown
    id: size
    attributes:
      label: How many operators are on your instance
      options:
        - "1–3"
        - "4–10"
        - "11–30"
        - "30+"
        - Not running it yet

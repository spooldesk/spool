name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the Dockerfile ships. Testing on a newer one than
          # production runs is how a green CI sits next to a broken deploy.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Sanity-check demo seed
        run: |
          python scripts/seed_demo_data.py
          python - <<'EOF'
          import sqlite3
          db = sqlite3.connect("demo_support.db")
          tickets = db.execute("SELECT COUNT(*) FROM tickets").fetchone()[0]
          assert tickets > 0, "demo seed produced no tickets"
          print(f"demo seed OK: {tickets} tickets")
          EOF

  # The image is what actually ships, and until now nothing built it before a
  # deploy did. A dependency that loses its wheel breaks here now, on a pull
  # request, instead of on the production host.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the container
        run: docker build -t spooldesk:ci .

      - name: It starts and answers
        run: |
          docker run -d --name ci-dash \
            -e DATABASE_URL="sqlite+aiosqlite:////tmp/ci.db" \
            -e ACCESS_PASSWORD="ci-password" \
            -p 8000:8000 spooldesk:ci \
            python -m uvicorn src.dashboard.app:app --host 0.0.0.0 --port 8000 \
            --no-proxy-headers
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "dashboard is up"
              exit 0
            fi
            sleep 2
          done
          echo "dashboard never answered"; docker logs ci-dash; exit 1

      - name: No Telegram was needed for any of that
        run: docker logs ci-dash 2>&1 | grep -q "without a Telegram channel"

  # The files that only run in production, checked somewhere other than
  # production. A Caddyfile with a typo in it fails at the moment a server
  # gets its first certificate, which is the worst moment available.
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The Caddyfile parses
        run: |
          docker run --rm \
            -e SPOOLDESK_DOMAIN=help.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: The production overlay merges
        run: |
          SPOOLDESK_DOMAIN=help.example.com \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config \
            > /tmp/merged.yml

      - name: And it does not expose the dashboard directly
        # The overlay's whole premise. If this ever publishes on 0.0.0.0 the
        # dashboard is reachable over plain HTTP next to the TLS one, and
        # nobody would notice because both work.
        run: |
          python3 - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("/tmp/merged.yml"))
          dash = cfg["services"]["dashboard"]
          for port in dash.get("ports", []):
              host = port.get("host_ip", "0.0.0.0")
              assert host in ("127.0.0.1", "::1"), (
                  f"dashboard is published on {host}, which the TLS proxy "
                  f"was supposed to be the only way in"
              )
          assert dash["environment"]["TRUSTED_PROXY_HOPS"] == "1", (
              "the proxy is in front but the app was not told, so every "
              "rate limit keyed on an address counts everyone as one visitor"
          )
          assert dash["environment"]["DASH_COOKIE_SECURE"] == "true"
          print("production overlay looks right")
          PY

      - name: The backup script is valid shell
        run: bash -n scripts/backup.sh

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test installer with isolated files and a fake Docker CLI
        run: python -m unittest discover -s tests/installer -p "test_*.py" -v

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify translations and export only public files
        run: python scripts/build_landing.py --check --export site
      - uses: actions/upload-artifact@v4
        with:
          name: spooldesk-landing-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 14

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the Dockerfile ships. Testing on a newer one than
          # production runs is how a green CI sits next to a broken deploy.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test dashboard browser logic (no npm dependencies)
        run: node --test tests/frontend/*.test.cjs

      - name: Sanity-check demo seed
        shell: bash
        run: |
          python scripts/seed_demo_data.py
          python - <<'EOF'
          import sqlite3
          db = sqlite3.connect("demo_support.db")
          tickets = db.execute("SELECT COUNT(*) FROM tickets").fetchone()[0]
          assert tickets > 0, "demo seed produced no tickets"
          print(f"demo seed OK: {tickets} tickets")
          EOF

  # The same tests, on the other engine. SQLite and PostgreSQL differ in a
  # handful of places — case-insensitive search, the in-place migrations, the
  # WAL pragma — and those are supposed to be the only ones. A claim like that
  # is worth exactly as much as a job that checks it.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spooldesk_test
          POSTGRES_USER: spooldesk
          POSTGRES_PASSWORD: ci-not-a-secret
        ports:
          - 5432:5432
        # Without this the steps start while the server is still coming up,
        # and the failure looks like a bug in the application.
        options: >-
          --health-cmd "pg_isready -U spooldesk -d spooldesk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run the suite against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://spooldesk:ci-not-a-secret@localhost:5432/spooldesk_test
        run: pytest -q

  # The image is what actually ships, and until now nothing built it before a
  # deploy did. A dependency that loses its wheel breaks here now, on a pull
  # request, instead of on the production host.
  image:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable ARM64 image execution on the build runner
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        env:
          # The emulator installer itself must run on the native runner first.
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        with:
          platforms: arm64

      - name: Build the container
        run: |
          docker build --platform linux/${{ matrix.arch }} -t spooldesk:ci .
          test "$(docker image inspect spooldesk:ci --format '{{.Architecture}}')" = '${{ matrix.arch }}'
          docker run --rm spooldesk:ci python -c "from importlib.metadata import version; assert version('multidict') == '6.9.1'"

      - name: It starts and answers
        run: |
          docker run -d --name ci-dash \
            -e DATABASE_URL="sqlite+aiosqlite:////tmp/ci.db" \
            -e ACCESS_PASSWORD="ci-password" \
            -p 8000:8000 spooldesk:ci \
            python -m uvicorn src.dashboard.app:app --host 0.0.0.0 --port 8000 \
            --no-proxy-headers
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "dashboard is up"
              exit 0
            fi
            sleep 2
          done
          echo "dashboard never answered"; docker logs ci-dash; exit 1

      - name: No Telegram was needed for any of that
        run: docker logs ci-dash 2>&1 | grep -q "without a Telegram channel"

      - name: The production image starts against PostgreSQL too
        run: |
          docker network create --internal ci-db
          docker run -d --name ci-pg --network ci-db \
            -e POSTGRES_DB=spooldesk -e POSTGRES_USER=spooldesk \
            -e 'POSTGRES_PASSWORD=ci@only/word:#%+?' postgres:16-alpine
          for i in $(seq 1 90); do
            if docker exec ci-pg pg_isready -U spooldesk -d spooldesk; then break; fi
            sleep 2
          done
          docker run -d --name ci-pg-dash --network ci-db \
            -e POSTGRES_HOST=ci-pg -e POSTGRES_USER=spooldesk -e POSTGRES_DB=spooldesk \
            -e 'POSTGRES_PASSWORD=ci@only/word:#%+?' \
            -e ACCESS_PASSWORD=ci-long-bootstrap-password spooldesk:ci \
            python -m uvicorn src.dashboard.app:app --host 0.0.0.0 --port 8000 --no-proxy-headers
          for i in $(seq 1 90); do
            if docker exec ci-pg-dash python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200"; then
              exit 0
            fi
            sleep 2
          done
          docker logs ci-pg-dash
          exit 1

      - name: Save the tested image for a manually requested release candidate
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir candidate-image
          docker tag spooldesk:ci spooldesk:rc-${{ github.sha }}-${{ matrix.arch }}
          docker image inspect spooldesk:rc-${{ github.sha }}-${{ matrix.arch }} --format '{{.Id}}' > candidate-image/IMAGE_ID
          printf '%s\n' 'spooldesk:rc-${{ github.sha }}-${{ matrix.arch }}' > candidate-image/IMAGE_TAG
          docker save spooldesk:rc-${{ github.sha }}-${{ matrix.arch }} | gzip > candidate-image/spooldesk-image.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: candidate-image-${{ github.sha }}-${{ matrix.arch }}
          path: candidate-image/
          if-no-files-found: error
          retention-days: 7

      - name: Remove CI containers
        if: always()
        run: |
          docker rm -fv ci-dash ci-pg-dash ci-pg || true
          docker network rm ci-db || true

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tools.txt

      - name: Install isolated lock and audit tools
        run: |
          python -m venv .venv-tools
          .venv-tools/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-tools.txt
          .venv-tools/bin/python -m pip check

      - name: Inputs and generated locks agree
        run: |
          .venv-tools/bin/uv pip compile requirements.in --python-version 3.12 --universal --generate-hashes --no-build --no-config --no-python-downloads --custom-compile-command 'uv pip compile requirements.in --python-version 3.12 --universal --generate-hashes --no-build -o requirements.txt' -o requirements.txt --quiet
          .venv-tools/bin/uv pip compile requirements-dev.in --python-version 3.12 --universal --generate-hashes --no-build --no-config --no-python-downloads --custom-compile-command 'uv pip compile requirements-dev.in --python-version 3.12 --universal --generate-hashes --no-build -o requirements-dev.txt' -o requirements-dev.txt --quiet
          .venv-tools/bin/uv pip compile requirements-tools.in --python-version 3.12 --universal --generate-hashes --no-build --no-config --no-python-downloads --custom-compile-command 'uv pip compile requirements-tools.in --python-version 3.12 --universal --generate-hashes --no-build -o requirements-tools.txt' -o requirements-tools.txt --quiet
          git diff --exit-code -- requirements.txt requirements-dev.txt requirements-tools.txt

      - name: Audit pinned runtime and test dependencies
        run: .venv-tools/bin/python -m pip_audit --require-hashes -r requirements.txt -r requirements-dev.txt --progress-spinner off

      - name: Audit maintenance tools
        run: .venv-tools/bin/python -m pip_audit --require-hashes -r requirements-tools.txt --progress-spinner off

  # The files that only run in production, checked somewhere other than
  # production. A Caddyfile with a typo in it fails at the moment a server
  # gets its first certificate, which is the worst moment available.
  deployment:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-deployment-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned configuration parser
        # PyYAML is part of the runtime lock; do not rely on runner-global packages.
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: The Caddyfile parses
        run: |
          docker run --rm \
            -e SPOOLDESK_DOMAIN=help.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      # Both compose files declare `env_file: .env`, and compose refuses to
      # merge without it. The file is gitignored, so CI has to make one — and
      # copying the example is the useful way to do it, because a broken
      # .env.example then fails here too.
      - name: An environment to merge against
        run: cp .env.example .env

      - name: Preflight checks the effective Compose environment
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          Path('ci-preflight.env').write_text(
              'DATABASE_URL=sqlite+aiosqlite:///local.db\n'
              'ACCESS_PASSWORD=ci-long-bootstrap-password\n'
              'BOT_TOKEN=\nADMIN_CHAT_ID=0\nDASH_COOKIE_SECURE=false\n'
              'SPOOLDESK_DOMAIN=help.example.com\n'
              "POSTGRES_PASSWORD='ci@only/word:#%+?'\n"
              f'DASH_SECRET_KEY={secrets.token_urlsafe(48)}\n'
              f'SECRETS_KEY={secrets.token_urlsafe(48)}\n'
          )
          PY
          python scripts/preflight.py --env-file ci-preflight.env --public-url https://help.example.com \
            --compose-file docker-compose.yml --compose-file docker-compose.prod.yml
          python scripts/preflight.py --env-file ci-preflight.env --public-url https://help.example.com \
            --compose-file docker-compose.yml --compose-file docker-compose.prod.yml \
            --compose-file docker-compose.postgres.yml

      - name: The production overlay merges
        run: |
          SPOOLDESK_DOMAIN=help.example.com \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config \
            > /tmp/merged.yml

      - name: And it does not expose the dashboard directly
        # The overlay's whole premise. If this ever publishes on 0.0.0.0 the
        # dashboard is reachable over plain HTTP next to the TLS one, and
        # nobody would notice because both work.
        run: |
          python3 - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("/tmp/merged.yml"))
          dash = cfg["services"]["dashboard"]
          for port in dash.get("ports", []):
              host = port.get("host_ip", "0.0.0.0")
              assert host in ("127.0.0.1", "::1"), (
                  f"dashboard is published on {host}, which the TLS proxy "
                  f"was supposed to be the only way in"
              )
          assert dash["environment"]["TRUSTED_PROXY_HOPS"] == "1", (
              "the proxy is in front but the app was not told, so every "
              "rate limit keyed on an address counts everyone as one visitor"
          )
          assert dash["environment"]["DASH_COOKIE_SECURE"] == "true"
          print("production overlay looks right")
          PY

      - name: The PostgreSQL overlay merges, alone and with the rest
        run: |
          POSTGRES_PASSWORD=ci-not-a-secret \
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
            config --quiet
          POSTGRES_PASSWORD=ci-not-a-secret SPOOLDESK_DOMAIN=help.example.com \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            -f docker-compose.postgres.yml config --quiet

      - name: The backup scripts are valid shell
        run: |
          bash -n scripts/backup.sh
          bash -n scripts/backup_schedule.sh
      - name: A backup refuses to run against PostgreSQL
        # It snapshots SQLite with SQLite's own API. Pointed at PostgreSQL it
        # would archive an empty database it created itself, and the archive
        # would look fine right up until the day somebody restored it.
        run: |
          echo "DATABASE_URL=postgresql+asyncpg://u:p@postgres/spooldesk" > .env
          if bash scripts/backup.sh /tmp/should-not-appear; then
            echo "it produced a backup of a database it cannot read" >&2
            exit 1
          fi
          if [ -e /tmp/should-not-appear ]; then
            echo "it wrote something anyway" >&2
            exit 1
          fi
          echo "refused, as it should"

      - name: The schedule installs, shows and removes itself
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cron > /dev/null
          bash scripts/backup_schedule.sh 04:15
          if ! bash scripts/backup_schedule.sh --show | grep -q "^15 4 "; then
            echo "the entry is not at the time it was given" >&2
            exit 1
          fi
          bash scripts/backup_schedule.sh 05:20
          if [ "$(crontab -l | grep -c spooldesk-backup)" -ne 1 ]; then
            echo "installing twice left more than one entry" >&2
            exit 1
          fi
          bash scripts/backup_schedule.sh --remove
          bash scripts/backup_schedule.sh --show | grep -q "No Spooldesk backup"

  release-candidate:
    # Manual packaging only. No tag, registry push, public release or deploy.
    if: github.event_name == 'workflow_dispatch'
    needs: [landing, test, postgres, image, dependencies, deployment, installer-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-image-${{ github.sha }}-amd64
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: candidate-image-${{ github.sha }}-arm64
          path: candidate-arm64
      - name: Package the same commit after all release checks pass
        run: |
          git archive --format=tar.gz --prefix=spooldesk/ -o candidate/spooldesk-source.tar.gz HEAD
          git archive --format=zip --prefix=spooldesk/ -o candidate/spooldesk-source.zip HEAD
          git rev-parse HEAD > candidate/SOURCE_COMMIT
          mv candidate-arm64/spooldesk-image.tar.gz candidate/spooldesk-image-arm64.tar.gz
          mv candidate-arm64/IMAGE_ID candidate/IMAGE_ID_ARM64
          mv candidate-arm64/IMAGE_TAG candidate/IMAGE_TAG_ARM64
          cp docs/SECOND_COMPUTER_INSTALL.md candidate/INSTALL-RU.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidate = Path('candidate')
          validation = {
              'source_commit': candidate.joinpath('SOURCE_COMMIT').read_text().strip(),
              'image_id': candidate.joinpath('IMAGE_ID').read_text().strip(),
              'image_tag': candidate.joinpath('IMAGE_TAG').read_text().strip(),
              'images': {
                  'linux/amd64': {
                      'archive': 'spooldesk-image.tar.gz',
                      'image_id': candidate.joinpath('IMAGE_ID').read_text().strip(),
                      'image_tag': candidate.joinpath('IMAGE_TAG').read_text().strip(),
                      'execution': 'native Linux amd64 CI',
                  },
                  'linux/arm64': {
                      'archive': 'spooldesk-image-arm64.tar.gz',
                      'image_id': candidate.joinpath('IMAGE_ID_ARM64').read_text().strip(),
                      'image_tag': candidate.joinpath('IMAGE_TAG_ARM64').read_text().strip(),
                      'execution': 'QEMU ARM64 on Linux amd64 CI; native host trial pending',
                  },
              },
              'ci_run_url': '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              'installer_checks': 'native Windows/macOS/Linux shell tests with fake Docker; actual Linux Docker install and repeat startup gate artifact upload',
              'automated_checks': 'passed: Windows/Linux tests, PostgreSQL tests, amd64/arm64 image startup with SQLite and PostgreSQL, patched runtime dependency, dependencies, deployment, landing',
              'second_computer_acceptance': 'pending owner confirmation',
              'release_status': 'candidate; not stable production acceptance',
          }
          candidate.joinpath('VALIDATION.json').write_text(json.dumps(validation, indent=2) + '\n')
          PY
          cd candidate
          sha256sum spooldesk-image.tar.gz spooldesk-image-arm64.tar.gz spooldesk-source.tar.gz spooldesk-source.zip IMAGE_ID IMAGE_TAG IMAGE_ID_ARM64 IMAGE_TAG_ARM64 SOURCE_COMMIT INSTALL-RU.md VALIDATION.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Add launchers and build the installation ZIP
        run: python3 scripts/package_install_bundle.py candidate --version v0.1.0-rc.7
      - name: Exercise the actual extracted installer and repeat startup
        env:
          SPOOLDESK_INSTALLER_NO_BROWSER: "1"
          SPOOLDESK_INSTALLER_NO_PAUSE: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('candidate/spooldesk-v0.1.0-rc.7-transfer.zip') as archive:
              archive.extractall('installer trial')
          PY
          cd 'installer trial'
          printf '1\n8000\nci-installer-test-password\nci-installer-test-password\ny\n' | bash INSTALL-LINUX.sh
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/healthz)" = 200
          sha256sum spooldesk/.env > before-restart.sha256
          bash INSTALL-LINUX.sh < /dev/null
          sha256sum --check before-restart.sha256
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/healthz)" = 200
      - name: Remove only this CI installation
        if: always()
        run: |
          if [ -f 'installer trial/spooldesk/.env' ]; then
            cd 'installer trial/spooldesk'
            docker compose -p spooldesk down -v || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: spooldesk-release-candidate-${{ github.sha }}
          path: |
            candidate/spooldesk-v0.1.0-rc.7-transfer.zip
            candidate/spooldesk-v0.1.0-rc.7-transfer.zip.sha256
          if-no-files-found: error
          retention-days: 14

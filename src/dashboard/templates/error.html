<!doctype html>
<html lang="{{ T.html_lang }}" class="h-full dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status_code }} · {{ g_brand_name or 'Support' }}</title>

  <script>
    (function(){
      var t = localStorage.getItem('dash-theme');
      if (t === 'light') document.documentElement.classList.remove('dark');
      else              document.documentElement.classList.add('dark');
    })();
  </script>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/tw.css?v={{ g_asset_v }}">
  <link rel="stylesheet" href="/static/app.css?v={{ g_asset_v }}">
</head>
<body class="h-full antialiased bg-gray-50 dark:bg-zinc-950 flex items-center justify-center p-4">

  <div class="w-full max-w-sm text-center">
    <div class="inline-flex w-12 h-12 rounded-xl bg-violet-600/10 dark:bg-violet-600/20
                items-center justify-center mb-5">
      <i class="ti {{ 'ti-error-404' if status_code == 404 else 'ti-alert-triangle' }}
                text-violet-600 dark:text-violet-400" style="font-size:24px" aria-hidden="true"></i>
    </div>

    <h1 class="text-5xl font-semibold text-gray-900 dark:text-zinc-100 tabular-nums mb-2">
      {{ status_code }}
    </h1>
    <p class="text-sm text-gray-500 dark:text-zinc-400 mb-8">
      {% if status_code == 404 %}
        {{ T.err_404 }}
      {% elif status_code == 403 %}
        {{ T.err_403 }}{% if detail %}: {{ detail }}{% endif %}.
      {% elif status_code == 429 %}
        {{ T.err_429 }}
      {% else %}
        {{ T.err_500 }}
      {% endif %}
    </p>

    <div class="flex items-center justify-center gap-2">
      <a href="/tickets"
         class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-medium text-white
                bg-violet-600 hover:bg-violet-500 transition-colors">
        <i class="ti ti-arrow-left" style="font-size:15px" aria-hidden="true"></i>
        {{ T.err_to_tickets }}
      </a>
      <button onclick="history.back()"
              class="px-4 py-2 rounded-xl text-sm font-medium
                     text-gray-600 dark:text-zinc-300
                     border border-gray-200 dark:border-zinc-700
                     hover:bg-gray-100 dark:hover:bg-zinc-900 transition-colors">
        {{ T.back }}
      </button>
    </div>
  </div>

</body>
</html>

# PostgreSQL instead of the bundled SQLite file.
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# and with TLS as well:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.postgres.yml up -d
#
# SQLite is the default and is not a compromise: with WAL it runs a support
# desk with a handful of operators without complaint, and it makes the whole
# instance one file to copy. This overlay is for the two cases where that
# stops being true — more than one dashboard process, or an operations team
# that would rather look after a database they already know.
#
# There is no automatic migration between the two engines. Starting with this
# overlay gives an empty helpdesk; moving an existing SQLite instance across
# means moving the data yourself.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spooldesk}
      POSTGRES_USER: ${POSTGRES_USER:-spooldesk}
      # No default. A database that invents its own password is a database
      # somebody forgets to change, and this one holds every conversation
      # your customers have ever had with you.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published. The two services that need it are on this network; a
    # database on the public internet is a different product's problem.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spooldesk} -d ${POSTGRES_DB:-spooldesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    # Waits for the healthcheck, not just for the container. Postgres accepts
    # connections a second or two after it starts existing, and the gap is
    # exactly long enough for create_all to fail on a cold boot.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spooldesk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spooldesk}
    logging: *logging

  bot:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spooldesk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spooldesk}
    logging: *logging

volumes:
  pgdata:
